name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-lint:
    name: PHP ${{ matrix.php }} syntax (all plugin and test files)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["7.4", "8.1", "8.3"]   # the plugin declares Requires PHP: 7.4 (issue #341)
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: php -l on every PHP file
        run: |
          set -e
          find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l | grep -v '^No syntax errors' || true
          if find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l 2>&1 | grep -v '^No syntax errors' | grep -q 'Parse error\|Fatal error'; then exit 1; fi

  unit:
    name: Standalone unit and contract harnesses (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    needs: php-lint
    strategy:
      fail-fast: false
      matrix:
        php: ["7.4", "8.1", "8.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: Run standalone harnesses (no WordPress needed)
        run: |
          set -e
          shopt -s nullglob
          files=(tests/unit/*.php tests/contract/*.php tests/security/*.php tests/runtime/*-unit-tests.php tests/runtime/*-harness.php tests/ai-connector/run-ai-connector-tests.php tests/ai-assist/run-tests.php tests/ai-services/run-contract-tests.php tests/hosted-ai-legacy/legacy-ai-tests.php)
          if [ ${#files[@]} -eq 0 ]; then echo "No standalone harnesses found"; exit 0; fi
          for f in "${files[@]}"; do
            echo "== $f"
            php -d error_reporting=-1 "$f"
          done
      - name: Quote request classifier (pure PHP, issue #191)
        run: php -d error_reporting=-1 tests/runtime/quote-request-classifier-tests.php
      - name: AI connector offline and consent tests
        run: php -d error_reporting=-1 tests/ai-connector/run-ai-connector-tests.php
      - name: AI connector 100 / 1k / 10k tenant cost simulation (issue #43, offline, about 70 s)
        run: php -d error_reporting=-1 tests/ai-connector/cost-simulation-test.php
      - name: Reproducible package and no development files (issue #3)
        run: bash tests/release/reproducible-build-check.sh
      - name: Other standalone suites that print PASS/FAIL (exit status gates the job)
        run: |
          set -e
          for f in tests/ai-assist/run-tests.php tests/ai-services/run-contract-tests.php tests/unit/ai-widget/run-tests.php tests/sms-cancel-reschedule-checks.php tests/release/check-release-metadata.php; do
            echo "== $f"
            php -d error_reporting=-1 "$f"
          done

  wordpress:
    # Issue #370: PHP 8.1, 8.2, 8.3 and 8.4 on latest WordPress, the minimum WordPress (6.6, from "Requires at least")
    # on PHP 8.3, and MySQL 8.0 next to MariaDB 10.11. The MySQL 8.0 entry uses the same steps as the MariaDB ones.
    name: WordPress runtime (WP ${{ matrix.wp }}, PHP ${{ matrix.php }}, ${{ matrix.db_label }})
    runs-on: ubuntu-latest
    needs: php-lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: "8.3", wp: "latest", db: "mariadb:10.11", db_label: "MariaDB 10.11" }
          - { php: "8.1", wp: "latest", db: "mariadb:10.11", db_label: "MariaDB 10.11" }
          - { php: "8.2", wp: "latest", db: "mariadb:10.11", db_label: "MariaDB 10.11" }
          - { php: "8.4", wp: "latest", db: "mariadb:10.11", db_label: "MariaDB 10.11" }
          - { php: "8.3", wp: "6.6", db: "mariadb:10.11", db_label: "MariaDB 10.11" }
          - { php: "8.3", wp: "latest", db: "mysql:8.0", db_label: "MySQL 8.0" }
    services:
      db:
        image: ${{ matrix.db }}
        env:
          MARIADB_ROOT_PASSWORD: root
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h127.0.0.1 -uroot -proot --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      WP_VERSION: ${{ matrix.wp }}
      WP_DIR: ${{ github.workspace }}/wp-site
      # WP-CLI lives outside the folder that holds WordPress. When it sits in the parent folder, `core install` stores
      # siteurl and home as http://localhost:8080/wp-site (WordPress guesses the path from the phar's folder), so the
      # login cookie is scoped to /wp-site/ and the logged-in checks are redirected to login (issue #190).
      WP_CLI: /tmp/tzfd-ci/wp-cli.phar
      WP_PORT: "8080"
      WP_URL: http://localhost:8080
      DB_NAME: wp_fd_ci
      DB_USER: wpfd
      DB_PASS: wpfdpass
      PLUGIN_SRC: ${{ github.workspace }}/titan-zero-trades-front-desk
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the upgrade check reads the v3.0.128 base commit from history
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, xml, mbstring, curl, zip, gd, intl
      - name: Get WP-CLI and WordPress
        run: |
          mkdir -p "$(dirname "$WP_CLI")"
          curl -sS -o "$WP_CLI" https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          if [ "$WP_VERSION" = "latest" ]; then WP_ZIP_URL=https://wordpress.org/latest.zip; else WP_ZIP_URL="https://wordpress.org/wordpress-$WP_VERSION.zip"; fi
          curl -sS -o wordpress.zip "$WP_ZIP_URL"
          unzip -q wordpress.zip && mv wordpress "$WP_DIR"
      - name: Create database and install WordPress
        run: |
          mysql -h127.0.0.1 -P3306 -uroot -proot -e "CREATE DATABASE $DB_NAME DEFAULT CHARACTER SET utf8mb4; CREATE USER '$DB_USER'@'%' IDENTIFIED BY '$DB_PASS'; GRANT ALL ON $DB_NAME.* TO '$DB_USER'@'%'; FLUSH PRIVILEGES;"
          cd "$WP_DIR"
          php "$WP_CLI" --allow-root config create --dbname=$DB_NAME --dbuser=$DB_USER --dbpass=$DB_PASS --dbhost=127.0.0.1:3306 --skip-check
          php "$WP_CLI" --allow-root core install --url=$WP_URL --title="FD CI" --admin_user=fdadmin --admin_password=fdadmin-test-pass --admin_email=admin@example.test --skip-email
          # Fail fast if the site was installed under a different URL path: every cookie and link would then be wrong.
          test "$(php "$WP_CLI" --allow-root option get siteurl)" = "$WP_URL" || { echo "siteurl is not $WP_URL"; exit 1; }
          test "$(php "$WP_CLI" --allow-root option get home)" = "$WP_URL" || { echo "home is not $WP_URL"; exit 1; }
      - name: Install plugin
        run: |
          cp -r "$PLUGIN_SRC" "$WP_DIR/wp-content/plugins/titan-zero-trades-front-desk"
          php "$WP_CLI" --allow-root --path="$WP_DIR" plugin activate titan-zero-trades-front-desk
      - name: Clean-install AI check (no AI call, no credential prompt)
        run: |
          cd "$WP_DIR"
          php "$WP_CLI" --allow-root --path="$WP_DIR" eval-file "$GITHUB_WORKSPACE/tests/runtime/clean-install-ai-check.php"
      - name: Start web server
        run: |
          (PHP_CLI_SERVER_WORKERS=8 nohup php -S localhost:$WP_PORT -t "$WP_DIR" > server.log 2>&1 &)
          for i in $(seq 1 30); do code=$(curl -s -o /dev/null -w "%{http_code}" $WP_URL/ || true); [ "$code" = "200" ] && break; sleep 1; done
          test "$code" = "200"
      - name: Enable missed-call addon and store secret
        run: |
          cd "$WP_DIR"
          php "$WP_CLI" --allow-root --path="$WP_DIR" eval '$l = array("tzfd-MissedCall","tzfd-Onboarding","tzfd-DashboardWidget"); TZFD_Scoped_Store::update("tz_fd_addons_active_list", $l); update_option("tz_fd_addons_active_list", $l); echo "ok\n";'
      - name: Store missed-call secret
        run: |
          cd "$WP_DIR"
          php "$WP_CLI" --allow-root --path="$WP_DIR" eval '$s = bin2hex(random_bytes(32)); TZFD_Addon_Support::save_global_settings("missed_call", TZFD_MissedCall::defaults(), array("inbound_secret" => $s)); file_put_contents("/tmp/fd-secret.txt", $s); echo "ok\n";'
      - name: Runtime tests (gates on every FAIL line and on the missed-call section)
        run: |
          set -o pipefail
          cd "$WP_DIR"
          LOG="$RUNNER_TEMP/runtime-tests.log"
          # runtime-tests.php reports each check as PASS or FAIL and exits 0 either way, so the step gates on the log.
          php "$WP_CLI" --allow-root --path="$WP_DIR" eval-file "$GITHUB_WORKSPACE/tests/runtime/runtime-tests.php" | tee "$LOG"
          if grep -q '^FAIL ' "$LOG"; then echo "Runtime checks failed:"; grep '^FAIL ' "$LOG"; exit 1; fi
          # The missed-call section (issue #30 call events and the refusal checks) must have run and passed.
          for check in 'signed missed call is accepted' 'anonymous caller task is marked no_callback_number' 'identical signed request is answered as replayed' 'ambiguous caller match still creates a task'; do
            grep -q "^PASS .*$check" "$LOG" || { echo "Missed-call check did not pass or did not run: $check"; exit 1; }
          done
      - name: Logged-in test users for the HTTP auth checks (as provision-wp-site.sh does)
        run: |
          cd "$WP_DIR"
          # Random per-run passwords: passed to later steps through GITHUB_ENV and never printed.
          ADMIN_PASS="rt_admin_$(openssl rand -hex 9)"
          SUB_PASS="rt_sub_$(openssl rand -hex 9)"
          echo "TZFD_RT_ADMIN_PASS=$ADMIN_PASS" >> "$GITHUB_ENV"
          echo "TZFD_RT_SUB_PASS=$SUB_PASS" >> "$GITHUB_ENV"
          php "$WP_CLI" --allow-root --path="$WP_DIR" user create rtadmin rt-admin@example.test --role=administrator --user_pass="$ADMIN_PASS" --quiet
          php "$WP_CLI" --allow-root --path="$WP_DIR" user create rtsub rt-sub@example.test --role=subscriber --user_pass="$SUB_PASS" --quiet
      - name: Site URL and version (diagnostics for the HTTP auth checks, issue #190)
        run: |
          cd "$WP_DIR"
          echo "WordPress version: $(php "$WP_CLI" --allow-root --path="$WP_DIR" core version)"
          echo "siteurl: $(php "$WP_CLI" --allow-root --path="$WP_DIR" option get siteurl)"
          echo "home: $(php "$WP_CLI" --allow-root --path="$WP_DIR" option get home)"
      - name: HTTP auth tests
        run: |
          cd "$GITHUB_WORKSPACE/tests/runtime"
          # The server started in an earlier step does not answer here, so start it again in its own session.
          if [ "$(curl -s -o /dev/null -w '%{http_code}' "$WP_URL/" || true)" != "200" ]; then
            setsid nohup php -S localhost:$WP_PORT -t "$WP_DIR" > "$GITHUB_WORKSPACE/server-http.log" 2>&1 < /dev/null &
            for i in $(seq 1 30); do c=$(curl -s -o /dev/null -w '%{http_code}' "$WP_URL/" || true); [ "$c" = "200" ] && break; sleep 1; done
            test "$c" = "200"
          fi
          B="$WP_URL" SECRET="$(cat /tmp/fd-secret.txt)" bash http-auth-tests.sh
      - name: Concurrent replay of a signed missed-call request
        run: |
          cd "$GITHUB_WORKSPACE/tests/runtime"
          B="$WP_URL" SECRET="$(cat /tmp/fd-secret.txt)" N=8 bash replay-concurrency-test.sh
      - name: Callback form HTTP checks (published page with the shortcode)
        run: |
          cd "$WP_DIR"
          PAGE_ID=$(php "$WP_CLI" --allow-root --path="$WP_DIR" post create --post_type=page --post_status=publish --post_title="Callback request" --post_content='[tzfd_callback_form]' --porcelain)
          cd "$GITHUB_WORKSPACE/tests/runtime"
          B="$WP_URL" PAGE="$WP_URL/?page_id=$PAGE_ID" bash handoff-http-tests.sh
      - name: Extra WordPress test files (if any)
        run: |
          cd "$WP_DIR"
          files=$(find "$GITHUB_WORKSPACE/tests" \( -name '*-wp-tests.php' -o -name '*-runtime-tests.php' -o -name 'wp-integration.php' \) ! -name 'runtime-tests.php' | sort)
          if [ -z "$files" ]; then echo "No extra WordPress test files"; exit 0; fi
          set -o pipefail
          LOG="$RUNNER_TEMP/extra-wp-tests.log"
          : > "$LOG"
          for f in $files; do
            echo "== $f"
            php "$WP_CLI" --allow-root --path="$WP_DIR" eval-file "$f" 2>&1 | tee -a "$LOG"
          done
          # Some of these files print FAIL lines and still exit 0 (quote-request-runtime-tests.php and
          # security-runtime-tests.php have no exit status), so the step gates on the log like the runtime step.
          if grep -q '^FAIL ' "$LOG"; then echo "Extra WordPress checks failed:"; grep '^FAIL ' "$LOG"; exit 1; fi
      - name: Cancel/reschedule assistant and service finder runtime checks (issue #191)
        run: |
          cd "$WP_DIR"
          set -o pipefail
          LOG="$RUNNER_TEMP/runtime-191.log"
          : > "$LOG"
          # These two files print PASS and FAIL lines and do not set an exit status, so the step gates on the log.
          for f in cancel-reschedule-assistant-tests.php service-finder-runtime.php; do
            echo "== $f"
            php "$WP_CLI" --allow-root --path="$WP_DIR" eval-file "$GITHUB_WORKSPACE/tests/runtime/$f" 2>&1 | tee -a "$LOG"
          done
          if grep -q '^FAIL ' "$LOG"; then echo "Runtime checks failed:"; grep '^FAIL ' "$LOG"; exit 1; fi
          test "$(grep -c '^PASS ' "$LOG")" -gt 0 || { echo "No PASS lines: the files did not run"; exit 1; }
      - name: Database integration tests (scratch databases on the service container)
        run: |
          mysql -h127.0.0.1 -P3306 -uroot -proot -e "CREATE DATABASE IF NOT EXISTS tzfd_lane_test; CREATE DATABASE IF NOT EXISTS tzfd_triage_test;"
          cd "$GITHUB_WORKSPACE"
          TZFD_TEST_DB_HOST=127.0.0.1 TZFD_TEST_DB_USER=root TZFD_TEST_DB_PASS=root TZFD_TEST_DB_NAME=tzfd_lane_test php -d error_reporting=-1 tests/integration/contact-db-tests.php
          TZFD_TEST_DB_HOST=127.0.0.1 TZFD_TEST_DB_USER=root TZFD_TEST_DB_PASS=root TZFD_TEST_DB_NAME=tzfd_triage_test php -d error_reporting=-1 tests/integration/enquiry-triage-db-test.php
      - name: Opt-in uninstall check (destructive, own process, last on this site)
        run: |
          cd "$WP_DIR"
          php "$WP_CLI" --allow-root --path="$WP_DIR" eval-file "$GITHUB_WORKSPACE/tests/runtime/uninstall-wipe-check.php" --user=1
      - name: Upgrade and downgrade from 3.0.128 (own disposable site)
        run: |
          # The helper scripts connect as root over TCP to the service container (credentials as the service sets them).
          printf '[client]\nuser=root\npassword=root\nhost=127.0.0.1\nport=3306\n' > "$HOME/.my.cnf"
          chmod 600 "$HOME/.my.cnf"
          cd "$GITHUB_WORKSPACE"
          TZFD_RT_DB_HOST=127.0.0.1 TZFD_RT_DB_GRANT_HOST='%' WP_CLI="php $WP_CLI" bash tests/runtime/upgrade-from-3.0.128.sh
      - name: Server log on failure
        if: failure()
        run: tail -n 200 server.log || true

  db-integration:
    name: DB integration (MariaDB 10.11, PHP 8.3)
    runs-on: ubuntu-latest
    needs: php-lint
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      TZFD_TEST_DB_HOST: 127.0.0.1
      TZFD_TEST_DB_USER: root
      TZFD_TEST_DB_PASS: root
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mysqli
      - name: Create scratch databases
        run: |
          mysql -h127.0.0.1 -P3306 -uroot -proot -e "CREATE DATABASE IF NOT EXISTS tzfd_lane_test; CREATE DATABASE IF NOT EXISTS tzfd_triage_test;"
      - name: Contact action and SMS conversation DB tests
        run: TZFD_TEST_DB_NAME=tzfd_lane_test php tests/integration/contact-db-tests.php
      - name: Enquiry triage DB tests
        run: TZFD_TEST_DB_NAME=tzfd_triage_test php tests/integration/enquiry-triage-db-test.php

  wordpress-multisite:
    name: WordPress multisite runtime (latest WordPress, PHP 8.3, MariaDB 10.11)
    runs-on: ubuntu-latest
    needs: php-lint
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      TZFD_RT_DB_HOST: 127.0.0.1
      TZFD_RT_DB_GRANT_HOST: "%"
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mysqli, xml, mbstring, curl, zip, gd, intl
      - name: Get WP-CLI
        run: curl -sS -o "$RUNNER_TEMP/wp-cli.phar" https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
      - name: MySQL client credentials for the runtime scripts (CI service only)
        run: |
          printf '[client]\nuser=root\npassword=root\nhost=127.0.0.1\nport=3306\n' > "$HOME/.my.cnf"
          chmod 600 "$HOME/.my.cnf"
      - name: Multisite runtime suite (provisions a disposable network, then tears it down)
        env:
          WP_CLI: php ${{ runner.temp }}/wp-cli.phar
        run: bash tests/runtime/run-wp-runtime.sh --multisite
